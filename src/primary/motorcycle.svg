<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Seat -->
  <rect x="8" y="22" width="12" height="4" rx="2"
    fill="var(--symbol-color)"
    stroke="var(--symbol-dark)"
    stroke-width="1.5"/>
  <!-- Fuel tank -->
  <ellipse cx="24" cy="21" rx="7" ry="5"
    fill="var(--symbol-color)"
    stroke="var(--symbol-dark)"
    stroke-width="1.5"/>
  <!-- Engine block -->
  <rect x="17" y="27" width="12" height="6" rx="2"
    fill="var(--symbol-color)"
    stroke="var(--symbol-dark)"
    stroke-width="1.5"/>
  <!-- Swingarm to rear wheel -->
  <polygon points="10,26 17,27 15,33 8,33"
    fill="var(--symbol-color)"
    stroke="var(--symbol-dark)"
    stroke-width="1.5"
    stroke-linejoin="round"/>
  <!-- Front fork -->
  <polygon points="31,15 35,15 37,30 33,30"
    fill="var(--symbol-color)"
    stroke="var(--symbol-dark)"
    stroke-width="1.5"
    stroke-linejoin="round"/>
  <!-- Handlebars -->
  <rect x="29" y="11" width="9" height="4" rx="1.5"
    fill="var(--symbol-color)"
    stroke="var(--symbol-dark)"
    stroke-width="1.5"/>
  <!-- Tank detail -->
  <ellipse cx="24" cy="21" rx="4" ry="3"
    fill="var(--detail-color)"/>
  <!-- Rear wheel -->
  <circle cx="13" cy="36" r="6.5" fill="rgba(0,0,0,0.85)"/>
  <circle cx="13" cy="36" r="3" fill="rgba(255,255,255,0.45)"/>
  <!-- Front wheel -->
  <circle cx="35" cy="36" r="6.5" fill="rgba(0,0,0,0.85)"/>
  <circle cx="35" cy="36" r="3" fill="rgba(255,255,255,0.45)"/>
</svg>
