<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Chassis -->
  <rect x="5" y="26" width="38" height="11" rx="3"
    fill="var(--symbol-color)"
    stroke="var(--symbol-dark)"
    stroke-width="1.5"/>
  <!-- Cab -->
  <rect x="5" y="14" width="22" height="14" rx="3"
    fill="var(--symbol-color)"
    stroke="var(--symbol-dark)"
    stroke-width="1.5"/>
  <!-- Truck bed walls -->
  <rect x="27" y="20" width="16" height="8" rx="2"
    fill="var(--symbol-color)"
    stroke="var(--symbol-dark)"
    stroke-width="1.5"/>
  <!-- Window -->
  <rect x="8" y="17" width="11" height="7" rx="2"
    fill="var(--detail-color)"/>
  <!-- Left wheel -->
  <circle cx="13" cy="37" r="5.5" fill="rgba(0,0,0,0.85)"/>
  <circle cx="13" cy="37" r="2.5" fill="rgba(255,255,255,0.45)"/>
  <!-- Right wheel -->
  <circle cx="35" cy="37" r="5.5" fill="rgba(0,0,0,0.85)"/>
  <circle cx="35" cy="37" r="2.5" fill="rgba(255,255,255,0.45)"/>
</svg>
